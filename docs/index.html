<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pixel Atelier — 単一HTML版</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f0e6;color:#17211b;font-family:Arial,sans-serif}header{padding:22px 5vw;border-bottom:1px solid #aaa;font:bold 16px monospace;letter-spacing:2px}main{max-width:1200px;margin:20px auto;padding:0 20px}h1{font:clamp(38px,6vw,72px) Georgia,serif;margin:0 0 30px}h1 em{color:#f05a32;font-style:normal}.app{display:grid;grid-template-columns:300px 1fr;border:1px solid #17211b}.panel{padding:22px;background:#faf8f1}.panel label{display:block;font-size:12px;font-weight:bold;margin:16px 0 5px}.panel input[type=range]{width:100%;accent-color:#f05a32}.row{display:flex;justify-content:space-between;border-bottom:1px solid #ccc;padding:11px 0;font-size:12px}.drop{border:1px dashed #777;padding:20px;text-align:center;cursor:pointer}.mode{display:flex;margin-top:18px}.mode button,.save button{flex:1;padding:12px;border:1px solid #17211b;background:white;cursor:pointer}.mode .on{background:#17211b;color:white}.view{background:#202b24;padding:30px;display:grid;place-items:center;min-width:0}.view canvas{max-width:100%;max-height:65vh;image-rendering:pixelated;box-shadow:0 15px 40px #0008}.save{display:flex;gap:8px;margin-top:14px}.save button{background:#f05a32;color:white}small{color:#666}@media(max-width:700px){.app{grid-template-columns:1fr}.view{min-height:340px}}</style></head><body><header>▦ PIXEL ATELIER <a href="https://tack0628.github.io/pixel-photo-tool/" target="_blank" rel="noopener noreferrer" style="float:right;color:inherit;font-size:11px">GB風フィルター ↗</a></header><main><div class="app"><section class="panel"><div class="drop" id="drop">↥<br><b>画像を選ぶ</b><br><small>画像は外部に送信されません</small><input id="file" hidden type="file" accept="image/*"></div><div class="mode"><button id="pixel" class="on">ドット絵風</button><button id="mosaic">モザイク</button></div><label>ピクセルの粗さ <output id="sv">12px</output></label><input id="size" type="range" min="3" max="48" value="12"><label>色数 <output id="cv">16色</output></label><input id="colors" type="range" min="2" max="64" value="16"><div class="row"><span>白黒化</span><input id="mono" type="checkbox"></div><div class="row"><span>輪郭強調</span><input id="edge" type="checkbox"></div><div class="row"><span>最近傍補間</span><input id="nearest" type="checkbox" checked></div><div class="row"><span>縦横比を維持</span><input id="ratio" type="checkbox" checked></div><div class="save"><button data-f="png">PNG保存・共有</button><button data-f="jpeg">JPEG保存・共有</button></div></section><section class="view"><canvas id="canvas"></canvas></section></div></main><script>const $=id=>document.getElementById(id),c=$('canvas'),x=c.getContext('2d'),img=new Image();let mode='pixel',name='image';img.onload=draw;img.src='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#f66"/><stop offset="1" stop-color="#443477"/></linearGradient></defs><rect width="900" height="600" fill="url(#g)"/><circle cx="650" cy="150" r="80" fill="#ffe98f"/><path d="M0 480 230 200 430 470 610 300 900 520v80H0Z" fill="#26345d"/></svg>');function draw(){let w=img.naturalWidth,h=$('ratio').checked?img.naturalHeight:w;c.width=w;c.height=h;let n=+$('size').value,t=document.createElement('canvas');t.width=Math.ceil(w/n);t.height=Math.ceil(h/n);let q=t.getContext('2d',{willReadFrequently:true});q.imageSmoothingEnabled=mode==='mosaic';q.drawImage(img,0,0,t.width,t.height);let z=q.getImageData(0,0,t.width,t.height),d=z.data,l=Math.max(2,Math.round(Math.cbrt(+$('colors').value))),s=255/(l-1);for(let i=0;i<d.length;i+=4){let r=d[i],g=d[i+1],b=d[i+2];if($('mono').checked)r=g=b=.299*r+.587*g+.114*b;d[i]=Math.round(r/s)*s;d[i+1]=Math.round(g/s)*s;d[i+2]=Math.round(b/s)*s}q.putImageData(z,0,0);x.imageSmoothingEnabled=mode==='mosaic'?!$('nearest').checked:false;x.drawImage(t,0,0,w,h);if($('edge').checked){let a=x.getImageData(0,0,w,h),o=new ImageData(w,h);for(let y=1;y<h-1;y++)for(let xx=1;xx<w-1;xx++){let p=(y*w+xx)*4,r=p+4,dd=p+w*4,k=Math.abs(a.data[p]-a.data[r])+Math.abs(a.data[p+1]-a.data[r+1])+Math.abs(a.data[p]-a.data[dd])>90;for(let j=0;j<3;j++)o.data[p+j]=k?20:a.data[p+j];o.data[p+3]=255}x.putImageData(o,0,0)}}$('drop').onclick=()=>$('file').click();$('file').onchange=e=>{let f=e.target.files[0];if(!f)return;name=f.name.replace(/\.[^.]+$/,'');let r=new FileReader;r.onload=()=>img.src=r.result;r.readAsDataURL(f)};['size','colors','mono','edge','nearest','ratio'].forEach(id=>$(id).oninput=()=>{$('sv').textContent=$('size').value+'px';$('cv').textContent=$('colors').value+'色';draw()});$('pixel').onclick=()=>{mode='pixel';$('pixel').className='on';$('mosaic').className='';draw()};$('mosaic').onclick=()=>{mode='mosaic';$('mosaic').className='on';$('pixel').className='';draw()};document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{let f=b.dataset.f,a=document.createElement('a');a.download=name+'-pixel.'+(f==='jpeg'?'jpg':'png');a.href=c.toDataURL('image/'+f,.92);a.click()});</script><script src="mobile-save.js"></script></body></html>
